<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#245B45" />
      <stop offset="100%" stop-color="#39765A" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9A15B" />
      <stop offset="100%" stop-color="#F3D77A" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#FAF7ED" stroke="#D8E2D5" stroke-width="2"/>
