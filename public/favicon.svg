  <line x1="20" y1="32" x2="44" y2="32" stroke="#E9A15B" stroke-width="3" stroke-dasharray="3,3" stroke-linecap="round"/>
  <!-- Molecule A (central atom & ligand) -->
  <circle cx="20" cy="32" r="10" fill="url(#g1)"/>
  <circle cx="12" cy="22" r="5" fill="#A8C3A0"/>
  <circle cx="12" cy="42" r="5" fill="#A8C3A0"/>
