  <line x1="20" y1="32" x2="12" y2="42" stroke="#245B45" stroke-width="2.5"/>
  <!-- Molecule B -->
  <circle cx="44" cy="32" r="8" fill="url(#g2)"/>
  <circle cx="52" cy="24" r="4.5" fill="#F3D77A"/>
  <line x1="44" y1="32" x2="52" y2="24" stroke="#E9A15B" stroke-width="2"/>
</svg>